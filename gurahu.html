    function generateHexFile(dataArray) {
        let hexLines = [];
        let currentAddress = 0x0000; // 開始アドレス
        const maxBytesPerLine = 16;  // 1行あたりの最大データ数（一般的には16バイト）

        for (let i = 0; i < dataArray.length; i += maxBytesPerLine) {
            // 1行分のデータを切り出す
            const chunk = dataArray.slice(i, i + maxBytesPerLine);

            const byteCount = chunk.length;
            const recordType = 0x00; // データレコード

            // 1. 各フィールドを2桁または4桁の16進数文字列に変換
            const byteCountHex = byteCount.toString(16).padStart(2, '0').toUpperCase();
            const addressHex = currentAddress.toString(16).padStart(4, '0').toUpperCase();
            const recordTypeHex = recordType.toString(16).padStart(2, '0').toUpperCase();

            // データの16進数化
            const dataHex = chunk.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('');

            // 2. チェックサムの計算（コロン以外の合計値の2の補数）
            let sum = byteCount + ((currentAddress >> 8) & 0xFF) + (currentAddress & 0xFF) + recordType;
            for (let b of chunk) {
                sum += b;
            }
            const checksum = (parseInt('100', 16) - (sum & 0xFF)) & 0xFF;
            const checksumHex = checksum.toString(16).padStart(2, '0').toUpperCase();

            // 3. レコードの結合
            hexLines.push(`:${byteCountHex}${addressHex}${recordTypeHex}${dataHex}${checksumHex}`);

            // 次の行へ向けてアドレスを進める
            currentAddress += byteCount;
        }

        // 4. 終了レコードを追加
        hexLines.push(":00000001FF");

        // 改行で連結してテキストを返す
        return hexLines.join('\n');
    }

    function downloadFile(content, fileName, contentType) {
        const a = document.createElement("a");
        const file = new Blob([content], { type: contentType });
        a.href = URL.createObjectURL(file);
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(a.href);
    }
    var rgb = (r, g, b) => {
        r = Math.round(r)
        if (r < 0) r = 0
        if (r > 255) r = 255
        g = Math.round(g)
        if (g < 0) g = 0
        if (g > 255) g = 255
        b = Math.round(b)
        if (b < 0) b = 0
        if (b > 255) b = 255
        return b + 256 * g + (256 ** 2) * r
    }
