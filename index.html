  <script>
    "use strict";
    var gameOver = async () => {
      hardStop = true;
      await new Promise((resolve) => {
        var n = 0;
        var a = setInterval(() => {
          n++;
          ctx.fillStyle = "rgba(255,0,0,0.05)";
          ctx.fillRect(0, 0, 160 * expansionLate, 100 * expansionLate);
          if (n == 45) {
            clearInterval(a);
            resolve();
          }
        }, 0);
      });
      playing = false;
      var over = document.getElementById("gameOver");
      over.style.display = "block";
    };
    var hiidenOver = () => {
      var over = document.getElementById("gameOver");
      over.style.display = "none";
    };
    var stageClear = () => {
      stop = true;
      var over = document.getElementById("stageClear");
      over.style.display = "block";
    };
    var hiidenClear = () => {
      stop = false;
      var over = document.getElementById("stageClear");
      over.style.display = "none";
    };
    var col = (obj1, obj2) => {
      var re = true;
      re = re && obj1.endP[0] > obj2.startP[0];
      re = re && obj1.endP[1] > obj2.startP[1];
      re = re && obj1.startP[0] < obj2.endP[0];
      re = re && obj1.startP[1] < obj2.endP[1];
      return re;
    };
    var ctx = document.getElementById("canvasMain").getContext("2d");
    var title = document.getElementById("title");
    var playing = false;
    var stop;
    var fps = 20;
    async function main() {
      title.style.display = "none";
      reset();
      stop = false;
      hardStop = false;
      playing = true;
      var BeforTime = Date.now();
      /*var up = async () => {
      if (Date.now() >= BeforTime + 1000 / fps) {
        update();
        BeforTime = Date.now();
      }
      if (playing) {
        requestAnimationFrame(up);
      }
    };
    up();*/
      var U1 = () => {
        update();
        if (playing) setTimeout(U1, 1000 / fps);
      };
      U1();
      await new Promise((resolve) => {
        var a = setInterval(() => {
          if (!playing) {
            clearInterval(a);
            resolve();
          }
        });
      });
      ctx.fillStyle = "rgb(0,0,0)";
      ctx.fillRect(0, 0, 160 * expansionLate, 100 * expansionLate);
      title.style.display = "block";
    }
    var to = (obj, to, speed = 1) => {
      var D = Math.sqrt((to.x - obj.x) ** 2 + (to.y - obj.y) ** 2);
      if (D > speed) {
        return [(speed * (to.x - obj.x)) / D, (speed * (to.y - obj.y)) / D]; //x,y
      } else {
        return [0, 0];
      }
    };
    var toAngle = (x, y) => {
      return Math.atan(y / x) / (Math.PI / 180) + (x < 0 ? 180 : 0);
    };
    var makeAngle = (angle, speed = 10) => {
      const x = speed * Math.cos(angle * (Math.PI / 180));
      const y = speed * Math.sin(angle * (Math.PI / 180));
      return { x: x, y: y };
    };
    var range = (n) => {
      return [...Array(n).keys()];
    };
    var random = (max, min) => {
      return Math.floor(Math.random() * (max - min)) + min;
    };
    class Keyboard {
      constructor() {
        this.keyboard = {};
        this.keycodes = {};
        var n;
        for (n of `QAZWSXEDCRFVTGBYHNUJMIKOLP`.split("")) {
          this.keycodes[`Key${n}`] = n;
        }
        for (n of `Up/Down/Left/Right`.split("/")) {
          this.keycodes[`Arrow${n}`] = n;
        }
        for (n of `Space/Enter`.split("/")) {
          this.keycodes[`${n}`] = n;
        }
        for (n of Object.values(this.keycodes)) {
          this.keyboard[n] = false;
        }
        document.addEventListener("keydown", (e) => {
          if (Object.keys(this.keycodes).includes(e.code)) {
            this.keyboard[
              Object.keys(this.keyboard)[
                Object.keys(this.keycodes).indexOf(e.code)
              ]
            ] = true;

                                  1,
                                  "rgb(200,200,0)",
                                  "key",
                                  false,
                                  (self) => {
                                    self.img = keyImg;
                                    self.g = -3;
                                  },
                                ),
                              );
                            }
                          },
                        ),
                      );
                    }
                  },
                )),
              );
            }
          }
        });
      });
      if (!keyFlag) {
        goal.img = goalImg;
      }
    };
    var dropObject = (
      x,
      y,
      w,
      h,
      Cbreak = false,
      hp = 10,
      color = "rgb(255,255,255)",
      id = "",
      col1 = true,
      s = (self) => {},
      u = (self) => {},
    ) => {
      return new Entity(
        x,
        y,
        w,
        h,
        (self) => {
          u(self);
          if (self.hp <= 0) {
            entitys.splice(entitys.indexOf(self), 1);
          }
          var b = 200;
          for (var n of range(b)) {
            self.y += self.g / b;
            var f = false;
            if (Math.abs(self.g / b) > 0) {
              entitys.forEach((n) => {
                if (
                  !(n == self || n == player || n == Phand) &&
                  n.col == true
                ) {
                  if (col(n, self)) {
                    f = true;
                  }
                }
              });
            }
            if (f) {
              while (f) {
                var f = false;
                entitys.forEach((n) => {
                  if (
                    !(n == self || n == player || n == Phand) &&
                    n.col == true &&
                    n.y > self.y
                  ) {
                    if (col(n, self)) {
                      f = true;
                    }
                  }
                });
                self.y -= 0.0001;
                self.sys();
              }
              self.y += 0.0002;
              self.g = 0;
              break;
            } else {
              self.g += 0.2 / b;
            }
          }
          var f = true;
          while (f) {
            var f = false;
            entitys.forEach((n) => {
              if (!(n == self || n == player || n == Phand) && n.col == true) {
                if (col(n, self)) {
                  f = true;
                }
              }
            });
            self.y -= 0.0001;
            self.sys();
          }
          self.y += 0.0002;
        },
        (self) => {
          self.img = ``;
          self.hp = hp;
          self.canBreakEntity = Cbreak;
          //self.col = col1
          self.id = id;
          self.g = 0;
          s(self);
        },
        color,
      );
    };
    var bulletObject = (
      x,
      y,
      w,
      h,
      Cbreak = false,
      hp = 10,
      color = "rgb(255,255,255)",
      id = "",
      col1 = true,
      s = (self) => {},
      u = (self) => {},
    ) => {
      return new Entity(
        x,
        y,
        w,
        h,
        (self) => {
          u(self);
          if (self.living % 60 == 0) {
            entitys.push(
              new Entity(
                self.x,
                self.y,
                3,
                3,
                (self) => {
                  var f = true;
                  entitys.forEach((n) => {
                    if (col(self, n) && n.id == "Cbreak" && f) {
                      if (n.canBreakEntity == true) {
                        n.hp -= 1;
                        f = false;
                      }
                    }
                  });
                  var a = makeAngle(self.angle, 1);
                  var f = false;
                  entitys.forEach((n) => {
                    if (n.col == true) {
                      if (col(n, self)) {
                        f = true;
                      }
                    }
                  });
                  if (f) {
                    self.del();
                    return;
                  }
                  self.x += a.x;
                  self.y += a.y;
                },
                (self) => {
                  var a = to(self, player);
                  self.angle = toAngle(a[0], a[1]);
                  self.id = "enemy";
                  self.color = "rgb(255,0,0)";
                },
              ),
            );
          }
          if (self.hp <= 0) {
            entitys.splice(entitys.indexOf(self), 1);
          }
        },
        (self) => {
          self.hp = hp;
          self.canBreakEntity = Cbreak;
          self.col = col1;
          self.id = id;
          s(self);
        },
        color,
      );
    };

    var voidObject = (
      x,
      y,
      w,
      h,
      Cbreak = false,
      hp = 10,
      color = "rgb(255,255,255)",
      id = "",
      col1 = true,
      s = (self) => {},
      u = (self) => {},
    ) => {
      return new Entity(
        x,
        y,
        w,
        h,
        (self) => {
          u(self);
          if (self.hp <= 0) {
            entitys.splice(entitys.indexOf(self), 1);
          }
        },
        (self) => {
          self.hp = hp;
          self.canBreakEntity = Cbreak;
          self.col = col1;
          self.id = id;
          s(self);
        },
        color,
      );
    };
    var newItem = (
      x,
      y,
      w,
      h,
      using = (self) => {},
      color = "rgb(255,255,255)",
      sub = (self) => {},
    ) => {
      return new Entity(
        x,
        y,
        w,
        h,
        (self) => {
          sub(self);
          if (self.having) {
            self.x = player.x;
            self.y = player.y;
            using(self);
          }
          if (
            controller.btn &&
            !self.beforBtn &&
            (self.having
              ? entitys
                  .map((x) => {
                    return x.id == "item" && x.having == true;
                  })
                  .includes(true)
              : col(self, player))
          ) {
            self.having = !self.having;
            self.x = player.x;
            self.y = player.y;
            self.angle = 0;
            self.sys();
            var n;
            for (n of entitys) {
              if (n.id == "item" && n != self) {
                while (col(self, n)) {
                  self.x++;
                  self.sys();
                }
              }
            }
          }
          self.beforBtn = controller.btn;
        },
        (self) => {
          self.using = using;
          self.having = false;
          self.beforBtn = controller.btn;
          self.id = "item";
        },
        color,
      );
    };
    var hardStop = false;
    var Phand;
    var reset = () => {
      entitys = [
        controller,
        (player = new Entity(
          80,
          50,
          3.2,
          9,
          (self) => {
            self.hanten = Math.abs(Phand.angle) < 90;
            var n;
            for (var n of range(100)) {
              var f = false;
              var c = (self.g + self.j) / 100;
              self.y += c;
              self.sys();
              entitys.forEach((n) => {
                if (n != self) {
                  if (col(self, n) && n.col == true) {
                    f = true;
                  }
                }
                n.sys();
              });
              if (f) {
                self.g = self.j = 0;
                if (c > 0 && controller.moveY > 5) {
                  self.j = -3.7;
                }
                while (f) {
                  self.y -= 0.00001 * (c < 0 ? -1 : 1);
                  self.sys();
                  f = false;
                  entitys.forEach((n) => {
                    if (n != self) {
                      if (col(self, n) && n.col == true) {
                        f = true;
                      }
                    }
                    n.sys();
                  });
                }
                break;
              }
            }
            for (var n of range(100)) {
              var f = false;
              var c = (controller.moveX * 0.1) / 100;
              self.x -= c;
              entitys.forEach((n) => {
                if (n != self) {
                  n.sys();
                  if (col(self, n) && n.col == true) {
                    f = true;
                  }
                }
                n.sys();
              });
              if (f) {
                while (f) {
                  self.x -= 0.001 * (c < 0 ? 1 : -1);
                  self.sys();
                  f = false;
                  entitys.forEach((n) => {
                    if (n != self) {
                      if (col(self, n) && n.col == true) {
                        f = true;
                      }
                    }
                    n.sys();
                  });
                }
                self.sys();
                break;
              }
            }
            self.g += 0.2;
            if (!self.j == 0) self.j += 0.1;

            if (Math.abs(controller.moveX) > 0) {
              self.imgnum += 0.2;
            } else {
              self.imgnum = 1;
            }
            self.img = playerImages[Math.round(self.imgnum) % 3];

            for (var n of entitys) {
              if (col(self, n) && n.id == "goal" && keyFlag) {
                stagenumber++;
                stageClear();
                setTimeout(() => {
                  hiidenClear();
                  setstage();
                }, 1000);
                break;
              }
              if (col(self, n) && n.id == "enemy") {
                gameOver();
                break;
              }
              if (col(self, n) && n.id == "key") {
                keyFlag = true;
                goal.color = "rgb(0,0,0)";
                goal.img = "";
                n.del();
                break;
              }
            }
          },
          (self) => {
            self.img = playerImages[0];
            self.imgnum = 0;
            self.g = 0;
            self.j = 0;
          },
        )),
        (Phand = new Entity(
          30,
          50,
          1,
          1,
          (self) => {
            self.x = player.x;
            self.y = player.y;
            if (controller.distance > 0) {
              self.angle = controller.angle;
            }
            var move = makeAngle(self.angle, 10);
            self.x -= move.x;
            self.y -= move.y;
            var f = true;
            var f2 = true;
            entitys.forEach((n) => {
              if (col(self, n) && (n != self || n.id == "void")) {
                f2 = false;
              }
              if (
                col(self, n) &&
                n.id == "Cbreak" &&
                controller.btn &&
                f &&
                !self.bb
              ) {
                if (n.canBreakEntity == true) {
                  n.hp -= 9999;
                  f = false;
                }
              }
            });
            if (f2 && controller.btn && f && !self.bb) {
              var a;
              entitys.push(
                (a = voidObject(
                  Math.round(self.x / 10) * 10,
                  Math.round(self.y / 10) * 10,
                  10,
                  10,
                  true,
                  2,
                  "rgb(200,200,200)",
                  "Cbreak",
                  true,
                  (self) => {
                    self.img = blockImages[2];
                  },
                )),
              );
              if (col(player, a)) {
                var f = true;
                while (f) {
                  if (Math.abs(move.x) > Math.abs(move.y)) {
                    player.x +=
                      0.001 * (self.angle > -90 && self.angle < 90 ? 1 : -1);
                  } else {
                    player.y += 0.001 * (move.y > 0 ? 1 : -1);
                  }
                  player.sys();
                  f = false;
                  entitys.forEach((n) => {
                    if (n != player) {
                      if (col(player, n) && n.col == true) {
                        f = true;
                      }
                    }
                    n.sys();
                  });
                }
              }
              var ff = false;
              for (var n of entitys) {
                if (col(n, a) && !n == a) {
                  ff = true;
                }
              }
              if (ff) {
                a.del();
              }
            }
            self.bb = controller.btn;
          },
          (self) => {
            self.bb = true;
          },
          "rgba(0,0,0,0)",
        )),
      ];
      setstage();
    };
    var bP = false;
    var update = async () => {
      if (!hardStop) {
        if (keyboard.get().P && !bP) {
          stop = !stop;
          document.getElementById("stop").innerHTML = !stop ? "⏸️" : "▶️";
          document.getElementById("totitle").style.display =
            document.getElementById("restart").style.display = stop
              ? "block"
              : "none";
        }
        bP = keyboard.get().P;
        ctx.fillStyle = "rgb(100,255,255)";
        ctx.fillRect(0, 0, 16000, 10000);
        if (stop) {
          if (keyboard.get().T) {
            stagenumber = 0;
            playing = false;
          }
          if (keyboard.get().R) {
            setstage();
            stop = false;
          }
        }
        ctx.fillRect(0, 0, 16000, 10000);
        entitys.forEach((n) => {
          if (n.mustMove || !stop) {
            n.sys();
            if (n != controller) n.update(n);
            n.sys();
            n.sys2();
          }
          n.draw((ctx) => {
            if (n.hanten == true) ctx.scale(-1, 1);
          });
        });
        controller.update(controller);
        player.draw((ctx) => {
          if (player.hanten == true) ctx.scale(-1, 1);
        });
        if (stop) {
          ctx.fillStyle = "rgba(0,0,0,0.5)";
          ctx.fillRect(0, 0, 16000, 10000);
        }
      }
    };
    (() => {
      main();
      setInterval(() => {
        if (document.getElementById("gameOver").style.display == "block") {
          if (keyboard.get().C) {
            hiidenOver();
            main();
          } else if (keyboard.get().T) {
            hiidenOver();
          }
        }
        if (document.getElementById("title").style.display == "block") {
          if (keyboard.get().Space) {
            main();
          }
        }
      });
    })();
  </script>
</html>
