<script>
  var kickCtx=new (window.AudioContext || window.webkitAudioContext)();
    
    if (kickCtx.state === 'suspended') {
      kickCtx.resume();
    }
  var snCtx=new (window.AudioContext || window.webkitAudioContext)();
  

  if (snCtx.state === 'suspended') {
    snCtx.resume();
  }
    function playKick(vol) {
  try {
    const audioCtx = kickCtx

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    // 【修正】周波数を150Hzから「30Hz」まで落とす（0.01はエラーの原因になります）
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);

    // 【修正】音量の開始点をほんの少しだけズラして、確実にフェードアウトを効かせる
    gain.gain.setValueAtTime(vol?vol:1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

    osc.start(now);
    osc.stop(now + 0.3);
  } catch(e) {
    console.log(e);
  }
}

function playSnare(vol) {
  const audioCtx = snCtx
  const now = snCtx.currentTime;
  // 1. ノイズ（ザラザラ音）の生成
  const bufferSize = audioCtx.sampleRate * 0.2; 
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1; 
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 1000;

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(vol?vol:0.7, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

  noise.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);

  // 2. トーン音
  const osc = audioCtx.createOscillator();
  const oscGain = audioCtx.createGain();
  
  // 【修正】スネアのトーンも安全な値に変更
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(60, now + 0.1); 

  oscGain.gain.setValueAtTime(vol?vol:0.7, now);
  oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

  osc.connect(oscGain);
  oscGain.connect(audioCtx.destination);

  noise.start(now);
  noise.stop(now + 0.2);
  osc.start(now);
  osc.stop(now + 0.1);
}
var rn=0

  if (f==1) playKick(vol);
  else if(f==2)playSnare(vol);
  rn++
  ok(rn)
}

        [x, y, z] = [[...x], [...y], [...z]]

        y.shift()
        z.shift()
        var round = n => {
            var a = n; while (a > 2) a = a / 2
            while (a < 1) a = a * 2
            return [a, n]
        }
        var round2 = n => {
            var a = n; while (a > 2) a = a / 2
            while (a < 1) a = a * 2
            return a
        }
        var l = [1, ...x]

        l = l.map(round2)

    }

    function gcd(a, b) {
        return b === 0 ? a : gcd(b, a % b);
    }

    // 小数を分数に変換する関数
    function decimalToFraction(num) {
        if (num === 0) return [0, 1];

        // 誤差を考慮して文字列に変換し、小数点以下の桁数を取得
        const str = num.toString();
        const index = str.indexOf('.');

        if (index === -1) {
            return [num, 1]; // 整数の場合
        }

        const decimalPlaces = str.length - index - 1;
        const denominator = Math.pow(10, decimalPlaces);
        const numerator = Math.round(num * denominator);

        // 最大公約数で約分
        const divisor = gcd(Math.abs(numerator), denominator);

        return [numerator / divisor, denominator / divisor];
    }
    var check=()=>{
        var t=`${tracks[0][1]/defHz}\n`
        for(var n of tracks){

    }
