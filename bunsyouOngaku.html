    function decimalToFraction(num) {
        if (num === 0) return [0, 1];

        // 誤差を考慮して文字列に変換し、小数点以下の桁数を取得
        const str = num.toString();
        const index = str.indexOf('.');

        if (index === -1) {
            return [num, 1]; // 整数の場合
        }

        const decimalPlaces = str.length - index - 1;
        const denominator = Math.pow(10, decimalPlaces);
        const numerator = Math.round(num * denominator);

        // 最大公約数で約分
        const divisor = gcd(Math.abs(numerator), denominator);

        return [numerator / divisor, denominator / divisor];
    }

 random = (m, M, seed,seed1=1) => {
    const min = Math.min(m, M);
    const max = Math.max(m, M);
    const range = max - min + 1;
    const nextSeed = (seed *seed1* 1664525 + 1013904223) % 4294967296;
    const rnd = nextSeed / 4294967296;
    return Math.floor(rnd * range) + min;
};
var makeMelodySeed=(number=100,rest=7,type="maj",up=true)=>{

rest-=m.length
while(rest>0){

m=m[random(0,m.length-1,number,rest+1)]
rest-=m.length

}

r=[1,...r]
